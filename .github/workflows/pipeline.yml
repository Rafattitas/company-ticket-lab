name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test backend
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --env npm_config_cache=/tmp/npm-cache \
            --mount type=bind,src="$PWD/backend",dst=/app \
            --workdir /app \
            node:24-bookworm-slim@sha256:2fe369e969550cde8e867afc3fe370b260140cab4a23d467074295b42163d553 \
            sh -c 'npm ci && npm test'

      - name: Check frontend
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --env npm_config_cache=/tmp/npm-cache \
            --mount type=bind,src="$PWD/frontend",dst=/app \
            --workdir /app \
            node:24-bookworm-slim@sha256:2fe369e969550cde8e867afc3fe370b260140cab4a23d467074295b42163d553 \
            sh -c 'npm ci && npm run lint && npm run build'

      - name: Build Docker images
        run: |
          docker build --pull -t company-ticket-backend:ci ./backend
          docker build --pull -t company-ticket-frontend:ci ./frontend
          docker build --pull -t company-ticket-postgres:ci ./deploy/postgres

      - name: Integration test
        run: sudo bash deploy/integration-test.sh company-ticket-backend:ci company-ticket-postgres:ci

      - name: Scan Docker images
        run: bash deploy/scan-images.sh company-ticket-backend:ci company-ticket-frontend:ci company-ticket-postgres:ci

      - name: Export tested images
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker save \
            --output "$RUNNER_TEMP/company-ticket-images.tar" \
            company-ticket-backend:ci \
            company-ticket-frontend:ci \
            company-ticket-postgres:ci

      - name: Upload tested images
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tested-images-${{ github.run_attempt }}
          path: ${{ runner.temp }}/company-ticket-images.tar
          retention-days: 1
          if-no-files-found: error

  publish:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download tested images
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tested-images-${{ github.run_attempt }}
          path: ${{ runner.temp }}/tested-images

      - name: Load tested images
        run: docker load --input "$RUNNER_TEMP/tested-images/company-ticket-images.tar"

      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Publish images
        run: bash deploy/publish-images.sh

      - name: Log out of GHCR
        if: always()
        run: docker logout ghcr.io

  deploy:
    name: Deploy production
    needs: publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on:
      - self-hosted
      - Linux
      - X64
      - production
      - company-ticket
    environment:
      name: production
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Deploy release
        run: sudo -n /usr/local/sbin/company-ticket-deploy "${GITHUB_SHA}"
