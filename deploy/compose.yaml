name: company-ticket-lab

services:
  # Database data lives in an external volume so container replacement does not
  # replace the active database files.
  postgres:
    image: ${POSTGRES_IMAGE:?Set POSTGRES_IMAGE}
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_admin_password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    secrets:
      - postgres_admin_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal
      # Docker does not activate published ports for a container attached only
      # to an internal network. This dedicated bridge provides the gateway used
      # for the loopback-only administration port; no other service joins it.
      - database_management
    # The database is reachable from the VM itself only. Administrators connect
    # to this port through an authenticated SSH tunnel.
    ports:
      - "127.0.0.1:15432:5432"
    shm_size: 128m
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 200
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready --username=postgres --dbname=postgres
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    stop_grace_period: 30s

  # The backend is reachable only through Docker networks; no host port is
  # published for the API.
  backend:
    image: ${BACKEND_IMAGE:?Set BACKEND_IMAGE}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ticket_db
      DB_USER: ticket_app
      DB_PASSWORD_FILE: /run/secrets/postgres_app_password
    secrets:
      - postgres_app_password
    networks:
      - internal
    expose:
      - "3000"
    group_add:
      - "987"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 100
    stop_grace_period: 10s
  # Nginx is the only service published to users. The production host supplies
  # its LAN address through /etc/company-ticket/host.env.
  frontend:
    image: ${FRONTEND_IMAGE:?Set FRONTEND_IMAGE}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - internal
      - edge
    ports:
      - "${FRONTEND_BIND_ADDRESS:-127.0.0.1}:8080:8080"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 100
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
secrets:
  postgres_admin_password:
    file: /etc/company-ticket/secrets/postgres_password

  postgres_app_password:
    file: /etc/company-ticket/secrets/postgres_app_password

volumes:
  # Provisioned once on the host and intentionally kept outside Compose cleanup.
  postgres_data:
    external: true
    name: company-ticket-postgres-data

networks:
  # Shared private network provisioned on the host for controlled service access.
  internal:
    external: true
    name: company-ticket-internal
  edge:
    driver: bridge
  database_management:
    driver: bridge
